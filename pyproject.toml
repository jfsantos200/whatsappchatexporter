[project]
name = "whatsappchatexporter"
version = "0.1.0"
description = "CLI para exportar y respaldar chats de WhatsApp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WhatsApp Chat Exporter" }]
dependencies = [
  "typer>=0.12.3",
]

[project.scripts]
whatsappchatexporter = "whatsappchatexporter.cli:app"

[tool.typer]
pretty_exceptions_show_locals = false
